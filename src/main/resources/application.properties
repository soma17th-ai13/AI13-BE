server.port=8080

# H2 파일 모드 (재시작 후에도 데이터 유지)
spring.datasource.url=jdbc:h2:file:./data/knowledgedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 콘솔 (개발용)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Upstage API 키 (환경 변수에서 읽음)
upstage.api.key=${UPSTAGE_API_KEY:}
upstage.api.url=https://api.upstage.ai/v1/chat/completions
upstage.api.model=solar-pro2
