<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOMA Knowledge Graph 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 32px;
      font-size: 1.6rem;
      color: #1a1a2e;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card.full { grid-column: 1 / -1; }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e8eaf0;
      color: #1a1a2e;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #666;
      margin-bottom: 4px;
      margin-top: 10px;
    }
    label:first-of-type { margin-top: 0; }

    input, textarea, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
      color: #333;
      background: #fafafa;
      transition: border 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #6c63ff;
      background: #fff;
    }
    textarea { resize: vertical; min-height: 70px; }

    .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: #6c63ff; color: #fff; }
    .btn-secondary { background: #e8eaf0; color: #444; }
    .btn-danger { background: #ff4d6d; color: #fff; }

    .result {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 320px;
      overflow-y: auto;
      display: none;
    }
    .result.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .result.err { background: #fff0f0; border: 1px solid #fca5a5; color: #991b1b; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 6px; }
    th { background: #f4f5f9; padding: 7px 10px; text-align: left; font-weight: 600; color: #555; }
    td { padding: 7px 10px; border-top: 1px solid #eee; vertical-align: top; }

    .knowledge-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .knowledge-card {
      background: #f8f9ff;
      border: 1px solid #e0e3f0;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.82rem;
    }
    .knowledge-card .raw { color: #555; margin-bottom: 6px; }
    .knowledge-card .summary { font-weight: 600; color: #2d2d5e; margin-bottom: 4px; }
    .knowledge-card .tags span {
      display: inline-block;
      background: #ede9fe;
      color: #5b21b6;
      border-radius: 4px;
      padding: 2px 6px;
      margin: 2px 2px 0 0;
      font-size: 0.75rem;
    }
    .knowledge-card .ts { color: #aaa; font-size: 0.75rem; margin-top: 4px; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #ccc;
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .debate-result { white-space: pre-wrap; font-size: 0.83rem; line-height: 1.7; }
    .debate-round { font-weight: 700; color: #6c63ff; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>SOMA Knowledge Graph 테스트</h1>

  <div class="grid">

    <!-- 도메인 관리 -->
    <div class="card">
      <h2>도메인 관리</h2>

      <label>도메인 이름</label>
      <input id="domain-name" type="text" placeholder="예: 건강" />

      <label>설명</label>
      <input id="domain-desc" type="text" placeholder="예: 건강 및 수면 관련 데이터" />

      <div class="btn-row">
        <button class="btn-primary" onclick="createDomain()">도메인 생성</button>
        <button class="btn-secondary" onclick="loadDomains()">목록 새로고침</button>
      </div>

      <div id="domain-result" class="result"></div>

      <div id="domain-table-wrap" style="margin-top:14px; display:none;">
        <table>
          <thead><tr><th>ID</th><th>이름</th><th>설명</th><th>생성일</th></tr></thead>
          <tbody id="domain-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 지식 입력 / 조회 -->
    <div class="card">
      <h2>지식 입력 / 조회</h2>

      <label>도메인 선택</label>
      <select id="knowledge-domain"></select>

      <label>지식 입력 (rawInput)</label>
      <textarea id="knowledge-input" placeholder="예: 요즘 수면이 6시간 이하로 줄었고 아침에 일어나기 매우 힘들다"></textarea>

      <div class="btn-row">
        <button class="btn-primary" onclick="addKnowledge()">지식 저장</button>
        <button class="btn-secondary" onclick="listKnowledge()">목록 조회</button>
      </div>

      <div id="knowledge-result" class="result"></div>
      <div id="knowledge-list" class="knowledge-list"></div>
    </div>

    <!-- 도메인 채팅 -->
    <div class="card">
      <h2>도메인 채팅</h2>

      <label>도메인 선택</label>
      <select id="chat-domain"></select>

      <label>질문</label>
      <textarea id="chat-question" placeholder="예: 내 수면 패턴에서 주의할 점은?"></textarea>

      <div class="btn-row">
        <button class="btn-primary" onclick="sendChat()">질문하기</button>
      </div>

      <div id="chat-result" class="result"></div>
    </div>

    <!-- 멀티 에이전트 토론 -->
    <div class="card full">
      <h2>멀티 에이전트 토론</h2>
      <p style="font-size:0.82rem;color:#888;margin-bottom:12px;">
        저장된 모든 도메인 지식을 기반으로 3라운드 구조화 토론을 실행합니다. (시간이 다소 걸릴 수 있습니다)
      </p>
      <div class="btn-row">
        <button class="btn-danger" id="debate-btn" onclick="startDebate()">토론 시작</button>
      </div>
      <div id="debate-result" class="result"></div>
    </div>

  </div>

  <script>
    const BASE = '';

    function show(id, text, isOk) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'result ' + (isOk ? 'ok' : 'err');
      el.style.display = 'block';
    }

    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const res = await fetch(BASE + path, opts);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      if (!res.ok) throw new Error(typeof data === 'string' ? data : JSON.stringify(data, null, 2));
      return data;
    }

    // 페이지 로드 시 도메인 목록 불러오기
    window.onload = () => loadDomains();

    async function loadDomains() {
      try {
        const domains = await api('GET', '/api/domains');
        updateDomainDropdowns(domains);
        renderDomainTable(domains);
      } catch (e) {
        show('domain-result', '목록 불러오기 실패: ' + e.message, false);
      }
    }

    function updateDomainDropdowns(domains) {
      ['knowledge-domain', 'chat-domain'].forEach(id => {
        const sel = document.getElementById(id);
        const prev = sel.value;
        sel.innerHTML = domains.length === 0
          ? '<option value="">-- 도메인 없음 --</option>'
          : domains.map(d => `<option value="${d.id}">${d.name} (ID: ${d.id})</option>`).join('');
        if (prev) sel.value = prev;
      });
    }

    function renderDomainTable(domains) {
      const wrap = document.getElementById('domain-table-wrap');
      const tbody = document.getElementById('domain-tbody');
      if (domains.length === 0) { wrap.style.display = 'none'; return; }
      tbody.innerHTML = domains.map(d =>
        `<tr><td>${d.id}</td><td>${d.name}</td><td>${d.description}</td><td>${fmtDate(d.createdAt)}</td></tr>`
      ).join('');
      wrap.style.display = 'block';
    }

    async function createDomain() {
      const name = document.getElementById('domain-name').value.trim();
      const description = document.getElementById('domain-desc').value.trim();
      if (!name) { show('domain-result', '도메인 이름을 입력하세요.', false); return; }
      try {
        const d = await api('POST', '/api/domains', { name, description });
        show('domain-result', `생성 완료!\nID: ${d.id} | 이름: ${d.name}`, true);
        document.getElementById('domain-name').value = '';
        document.getElementById('domain-desc').value = '';
        await loadDomains();
      } catch (e) {
        show('domain-result', '오류: ' + e.message, false);
      }
    }

    async function addKnowledge() {
      const domainId = document.getElementById('knowledge-domain').value;
      const rawInput = document.getElementById('knowledge-input').value.trim();
      if (!domainId) { show('knowledge-result', '도메인을 선택하세요.', false); return; }
      if (!rawInput) { show('knowledge-result', '내용을 입력하세요.', false); return; }
      show('knowledge-result', 'AI 분석 중...', true);
      try {
        const k = await api('POST', `/api/domains/${domainId}/knowledge`, { rawInput });
        show('knowledge-result',
          `저장 완료!\n요약: ${k.summary}\n태그: ${k.tags}`, true);
        document.getElementById('knowledge-input').value = '';
      } catch (e) {
        show('knowledge-result', '오류: ' + e.message, false);
      }
    }

    async function listKnowledge() {
      const domainId = document.getElementById('knowledge-domain').value;
      if (!domainId) { show('knowledge-result', '도메인을 선택하세요.', false); return; }
      try {
        const list = await api('GET', `/api/domains/${domainId}/knowledge`);
        const container = document.getElementById('knowledge-list');
        if (list.length === 0) {
          container.innerHTML = '<p style="color:#aaa;font-size:0.82rem;">저장된 지식이 없습니다.</p>';
          return;
        }
        container.innerHTML = list.map(k => `
          <div class="knowledge-card">
            <div class="raw">입력: ${escHtml(k.rawInput)}</div>
            <div class="summary">${escHtml(k.summary)}</div>
            <div class="tags">${k.tags.split(',').map(t => `<span>${escHtml(t.trim())}</span>`).join('')}</div>
            <div class="ts">${fmtDate(k.createdAt)}</div>
          </div>`).join('');
      } catch (e) {
        show('knowledge-result', '오류: ' + e.message, false);
      }
    }

    async function sendChat() {
      const domainId = document.getElementById('chat-domain').value;
      const question = document.getElementById('chat-question').value.trim();
      if (!domainId) { show('chat-result', '도메인을 선택하세요.', false); return; }
      if (!question) { show('chat-result', '질문을 입력하세요.', false); return; }
      show('chat-result', 'AI 답변 생성 중...', true);
      try {
        const r = await api('POST', `/api/domains/${domainId}/chat`, { question });
        show('chat-result', r.answer, true);
      } catch (e) {
        show('chat-result', '오류: ' + e.message, false);
      }
    }

    async function startDebate() {
      const btn = document.getElementById('debate-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>토론 진행 중...';
      const resultEl = document.getElementById('debate-result');
      resultEl.style.display = 'block';
      resultEl.className = 'result ok';
      resultEl.textContent = '모든 도메인 에이전트가 토론을 준비하고 있습니다...';
      try {
        const r = await api('POST', '/api/debate', {});
        resultEl.innerHTML = formatDebate(r.result);
      } catch (e) {
        resultEl.className = 'result err';
        resultEl.textContent = '오류: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '토론 시작';
      }
    }

    function formatDebate(text) {
      return escHtml(text).replace(
        /(\[Round \d[^\]]*\])/g,
        '<span class="debate-round">$1</span>'
      );
    }

    function fmtDate(dt) {
      if (!dt) return '-';
      return new Date(dt).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' });
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
